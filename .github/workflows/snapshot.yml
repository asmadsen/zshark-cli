name: Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-main
  cancel-in-progress: true

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          SHA: ${{ github.sha }}
        run: echo "version=snapshot-${SHA::7}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: Build ${{ needs.meta.outputs.version }}
    needs: [meta, test]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  bundle:
    name: Bundle checksums
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zshark_${{ needs.meta.outputs.version }}_*
          merge-multiple: true
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: zshark_${{ needs.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true
